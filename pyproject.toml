[project]
name = "har-basic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cloud Mentor", email = "tibor.kiss@cloudmentor.hu" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
har-basic = "har_basic.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.6",
]

[tool.uv]
